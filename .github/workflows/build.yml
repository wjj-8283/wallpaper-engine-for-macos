name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Flake package to build
        type: choice
        default: ci
        options:
          - ci
          - ciNoMove
          - default

permissions:
  contents: read
  actions: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'rust-toolchain.toml', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-macos: 1073741824

      - name: Resolve compiler cache inputs
        id: cache
        run: |
          set -euo pipefail

          DEPS_HASH="$(
            shasum -a 256 Cargo.lock flake.lock rust-toolchain.toml \
              | awk '{ print $1 }' \
              | shasum -a 256 \
              | cut -c1-16
          )"
          ENGINE_SHA="$(git rev-parse HEAD:external/open-wallpaper-engine)"

          echo "deps=${DEPS_HASH}" >> "$GITHUB_OUTPUT"
          echo "engine=${ENGINE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Restore compiler caches
        uses: actions/cache@v4
        with:
          path: |
            /private/tmp/wallpaper-engine-ci/ccache
            /private/tmp/wallpaper-engine-ci/sccache
          key: compilers-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache.outputs.deps }}-${{ steps.cache.outputs.engine }}
          restore-keys: |
            compilers-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache.outputs.deps }}-
            compilers-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: nix build -L .#${{ inputs.package || 'ci' }}

      - name: Dump build diagnostics on failure
        if: failure()
        run: |
          set +e
          for d in /private/tmp/wallpaper-engine-ci/work/target/release/build/libgit2-sys-*/out; do
            echo "=== $d ==="
            ls -la "$d"
            ls -la "$d/include" 2>&1 | head -20
          done

      - name: Report compiler cache stats
        if: always()
        run: |
          for dir in /private/tmp/wallpaper-engine-ci/ccache /private/tmp/wallpaper-engine-ci/sccache; do
            if [[ -d "$dir" ]]; then
              echo "$dir: $(du -sh "$dir" | cut -f1)"
            else
              echo "$dir: missing"
            fi
          done

          if [[ -f /private/tmp/wallpaper-engine-ci/sccache.log ]]; then
            tail -20 /private/tmp/wallpaper-engine-ci/sccache.log || true
          fi

      - name: Package DMG
        id: dmg
        run: |
          set -euo pipefail

          APP="result/Applications/Wallpaper Engine.app"
          if [[ ! -d "$APP" ]]; then
            echo "error: app bundle not found at $APP" >&2
            ls -R result >&2 || true
            exit 1
          fi

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            DMG_NAME="Wallpaper-Engine-${GITHUB_REF_NAME}-${SHORT_SHA}"
          else
            DMG_NAME="Wallpaper-Engine-${VERSION}-${SHORT_SHA}"
          fi

          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          /usr/bin/hdiutil create \
            -volname "Wallpaper Engine" \
            -srcfolder "$STAGE" \
            -format UDZO \
            -ov \
            "${DMG_NAME}.dmg"

          /usr/bin/hdiutil verify "${DMG_NAME}.dmg"

          shasum -a 256 "${DMG_NAME}.dmg" | awk '{ print $1 }' > "${DMG_NAME}.dmg.sha256"

          echo "name=${DMG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Created ${DMG_NAME}.dmg ($(du -h "${DMG_NAME}.dmg" | cut -f1))"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperEngine-macOS-dmg
          path: |
            *.dmg
            *.dmg.sha256
          if-no-files-found: error
